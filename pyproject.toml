[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gutenberg-search"
version = "0.1.0"
description = "A search engine for Project Gutenberg texts"
readme = "README.md"
authors = [
    {name = "Developer"},
]
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.0.0",
    "ruff>=0.12.9",
]
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-asyncio>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=6.0",
    "pytest-asyncio>=0.15.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
